<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Tenlux - 页面未找到</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a0a0c" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f8f8fa" media="(prefers-color-scheme: light)">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Serif+SC:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
  <style>
    /* Specific adjustments for the 404 page */
    .hero-404 {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .hero-macro-text.macro-404 {
      font-size: clamp(120px, 35vw, 400px);
      letter-spacing: 5vw;
      padding-left: 5vw; /* Balance letter spacing */
    }
    .hero-404 .hero-content {
      transform: translateY(-5vh); /* Lift slightly to balance optical center */
    }
  </style>
</head>
<body>

  <!-- ─── Floating Nav Capsule (Minimal for 404) ─── -->
  <div class="nav-capsule visible" style="pointer-events: auto;">
    <div class="capsule-left">
      <img src="./media/app-icon.ico" alt="Tenlux" class="capsule-icon">
      <span class="capsule-section">Error 404</span>
    </div>
  </div>

  <main>
    <!-- ─── 404 Hero Section ─── -->
    <section class="hero-abstract hero-404">
      
      <!-- Background elements -->
      <div class="hero-perspective"></div>
      <div class="hero-glow"></div>
      <div class="hero-macro-text macro-404">404</div>

      <!-- Center content -->
      <div class="hero-content">
        <h1 class="hero-cn section-title" style="margin-bottom: 24px;">迷失于暗光之间</h1>
        <p class="hero-desc">
          您寻找的页面似乎已隐入黑夜，或者还未迎来晨光。<br>它可能被移动、重命名，或者从未存在过。
        </p>
        <div class="hero-actions" style="margin-top: 40px; justify-content: center;">
          <a class="btn btn-primary" href="./index.html">返回光源 (主页)</a>
        </div>
      </div>
      
    </section>
  </main>

  <!-- ─── Artisan Watermark ─── -->
  <div class="artisan-watermark" aria-hidden="true" style="opacity: 0.15;">/// CRAFTED BY Q1KO擎空</div>

  <script src="./anime.min.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      /* ── Character Hover Wave ── */
      var waveTargets = document.querySelectorAll(".section-title");
      waveTargets.forEach(function (el) {
        var text = el.textContent;
        el.textContent = "";
        el.classList.add("char-wave");
        for (var i = 0; i < text.length; i++) {
          var span = document.createElement("span");
          if (text[i] === " ") {
            span.className = "space";
            span.innerHTML = "&nbsp;";
          } else {
            span.textContent = text[i];
          }
          el.appendChild(span);
        }
        
        el.addEventListener("mousemove", function (e) {
          var spans = el.querySelectorAll("span");
          spans.forEach(function (s) {
            var r = s.getBoundingClientRect();
            var cx = r.left + r.width / 2;
            var dist = Math.abs(e.clientX - cx);
            if (dist < 80) {
              var lift = (1 - dist / 80) * 14;
              s.style.transform = "translateY(" + -lift + "px) scale(" + (1 + (1 - dist / 80) * 0.08) + ")";
              s.style.color = "var(--brand-glow)";
            } else {
              s.style.transform = "";
              s.style.color = "";
            }
          });
        });
        el.addEventListener("mouseleave", function () {
          el.querySelectorAll("span").forEach(function (s) {
            s.style.transform = "";
            s.style.color = "";
          });
        });

        // Entrance animation
        setTimeout(function() {
          var spans = el.querySelectorAll("span:not(.space)");
          spans.forEach(function (s, i) {
            setTimeout(function () {
              s.style.transform = "translateY(-14px) scale(1.08)";
              s.style.color = "var(--brand-glow)";
            }, i * 50);
            setTimeout(function () {
              s.style.transform = "";
              s.style.color = "";
            }, i * 50 + 300);
          });
        }, 500); // Slight delay for dramatic effect
      });

      /* ── 3D Tilt Follow on Main Text ── */
      var heroCn = document.querySelector(".hero-cn");
      if (heroCn && !window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        heroCn.addEventListener("mousemove", function (e) {
          var rect = heroCn.getBoundingClientRect();
          var nx = (e.clientX - rect.left) / rect.width;
          var ny = (e.clientY - rect.top) / rect.height;
          var rx = (ny - 0.5) * -15;
          var ry = (nx - 0.5) * 15;
          heroCn.style.transform = "perspective(800px) rotateX(" + rx + "deg) rotateY(" + ry + "deg) scale(1.02)";
        });
        heroCn.addEventListener("mouseleave", function () {
          heroCn.style.transform = "";
        });
      }

      /* ── Mouse parallax on massive background 404 ── */
      var macroText = document.querySelector(".hero-macro-text");
      if (macroText && !window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        window.addEventListener("mousemove", function (e) {
          var x = (e.clientX / window.innerWidth) - 0.5;
          var y = (e.clientY / window.innerHeight) - 0.5;
          macroText.style.transform = "translate(calc(-50% + " + (x * -60) + "px), calc(-50% + " + (y * -60) + "px))";
        });
      }
    });
  </script>
</body>
</html>
